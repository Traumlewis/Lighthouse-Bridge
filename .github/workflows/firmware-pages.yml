name: Firmware & WebFlasher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-matter-arduino-3.3.12-nimble-2.5.2-json-6.21.5-wm-2.0.17
      - name: Install firmware build dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'NimBLE-Arduino@2.5.2' 'ArduinoJson@6.21.5' 'WiFiManager@2.0.17'
      - name: Check command handling
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_core.cpp -o /tmp/lighthouse-test
          /tmp/lighthouse-test
      - name: Check station migration and OTA format
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_config.cpp -o /tmp/lighthouse-config-test
          /tmp/lighthouse-config-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_matter_config.cpp -o /tmp/lighthouse-matter-config-test
          /tmp/lighthouse-matter-config-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_ota.cpp -o /tmp/lighthouse-ota-test
          /tmp/lighthouse-ota-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_ota_receiver.cpp -o /tmp/lighthouse-ota-receiver-test
          /tmp/lighthouse-ota-receiver-test
          python -m unittest discover -s test -p 'test_ota_package.py' -v
      - name: Check bounded Matter status serialization
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_status.cpp -o /tmp/lighthouse-status-test
          /tmp/lighthouse-status-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_matter_endpoint.cpp -o /tmp/lighthouse-matter-endpoint-test
          /tmp/lighthouse-matter-endpoint-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_startup.cpp -o /tmp/lighthouse-startup-test
          /tmp/lighthouse-startup-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_model_startup.cpp -o /tmp/lighthouse-model-startup-test
          /tmp/lighthouse-model-startup-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_http_body.cpp -o /tmp/lighthouse-http-body-test
          /tmp/lighthouse-http-body-test
          g++ -std=c++11 -Wall -Wextra -Werror -I test/fakes -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_scan.cpp -o /tmp/lighthouse-scan-test
          /tmp/lighthouse-scan-test
          g++ -std=c++11 -Wall -Wextra -Werror -I test/fakes -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_http_memory.cpp -o /tmp/lighthouse-http-memory-test
          /tmp/lighthouse-http-memory-test
      - run: python -m pip install -r tools/requirements-matter-build.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/esp
          key: ${{ runner.os }}-rs-matter-esp-1.97.0.0-${{ hashFiles('firmware/rust/Cargo.lock') }}
      - name: Install pinned ESP32 Rust toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools
          curl -fsSL https://github.com/esp-rs/espup/releases/download/v0.19.0/espup-x86_64-unknown-linux-gnu -o .tools/espup
          chmod +x .tools/espup
          .tools/espup install --targets esp32,esp32c3,esp32s3 --toolchain-version 1.97.0.0 --export-file .tools/rs-export.sh
      - name: Build Lighthouse Bridge for all four boards
        run: |
          . .tools/rs-export.sh
          CARGO_BUILD_JOBS=2 python tools/build_rs_matter.py
          CARGO_BUILD_JOBS=2 python tools/build_rs_matter.py --board weact-c3
          CARGO_BUILD_JOBS=2 python tools/build_rs_matter.py --board c3-supermini
          CARGO_BUILD_JOBS=2 python tools/build_rs_matter.py --board s3-supermini
          for target in ESP32 ESP32C3 ESP32S3; do
            g++ -std=c++11 -Wall -Wextra -Werror -DCONFIG_IDF_TARGET_$target -I include test/test_gpio_buttons.cpp -o /tmp/lighthouse-gpio-$target
            /tmp/lighthouse-gpio-$target
            g++ -std=c++11 -Wall -Wextra -Werror -DCONFIG_IDF_TARGET_$target -I include test/test_ota_targets.cpp -o /tmp/lighthouse-ota-$target
            /tmp/lighthouse-ota-$target
          done
          CARGO_BUILD_JOBS=2 cargo +esp test --locked --manifest-path firmware/rust/Cargo.toml
          CARGO_BUILD_JOBS=2 cargo +esp test --locked --release --manifest-path firmware/rust/Cargo.toml
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_rs_matter.cpp -o /tmp/lighthouse-rs-matter-test
          /tmp/lighthouse-rs-matter-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_rs_preferences.cpp -o /tmp/lighthouse-rs-preferences-test
          /tmp/lighthouse-rs-preferences-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I "$HOME/Arduino/libraries/ArduinoJson/src" test/test_device_maintenance.cpp -o /tmp/lighthouse-maintenance-test
          /tmp/lighthouse-maintenance-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_network_mode.cpp -o /tmp/lighthouse-network-mode-test
          /tmp/lighthouse-network-mode-test
          g++ -std=c++11 -Wall -Wextra -Werror -I firmware test/test_rs_diagnostics.cpp -o /tmp/lighthouse-rs-diagnostics-test
          /tmp/lighthouse-rs-diagnostics-test
          g++ -std=c++11 -Wall -Wextra -Werror -I firmware test/test_rs_network.cpp -o /tmp/lighthouse-rs-network-test
          /tmp/lighthouse-rs-network-test
      - name: Build WebFlasher site
        run: python tools/build_pages.py
      - name: Test WebFlasher assets
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Check USB protocol and update layout
        run: |
          node test/serial_info.cjs
          node test/matter_info.cjs
      - name: Test simulated browser and USB flows
        timeout-minutes: 12
        run: |
          npm install --no-package-lock
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright install --with-deps chromium
            browser="$(node -p "require('playwright').chromium.executablePath()")"
          fi
          CHROMIUM_PATH="$browser" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-bridge-firmware
          path: dist/rs-matter/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Retain matching symbols for crash diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-bridge-debug
          include-hidden-files: true
          path: |
            .pio/rs-matter-build/RsMatter.ino.elf
            .pio/rs-matter-build/RsMatter.ino.map
            .pio/rs-matter-build-*/RsMatter.ino.elf
            .pio/rs-matter-build-*/RsMatter.ino.map

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish WebFlasher
        id: deployment
        uses: actions/deploy-pages@v4
