name: Firmware & WebFlasher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Check command handling
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_core.cpp -o /tmp/lighthouse-test
          /tmp/lighthouse-test
      - name: Build ESP32 firmware
        run: pio run
      - name: Check Hue write acknowledgements
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I .pio/libdeps/esp32dev/ArduinoJson/src test/test_hue.cpp -o /tmp/lighthouse-hue-test
          /tmp/lighthouse-hue-test
      - name: Check station migration and OTA format
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I .pio/libdeps/esp32dev/ArduinoJson/src test/test_config.cpp -o /tmp/lighthouse-config-test
          /tmp/lighthouse-config-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I .pio/libdeps/esp32dev/ArduinoJson/src test/test_matter_config.cpp -o /tmp/lighthouse-matter-config-test
          /tmp/lighthouse-matter-config-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_ota.cpp -o /tmp/lighthouse-ota-test
          /tmp/lighthouse-ota-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_ota_receiver.cpp -o /tmp/lighthouse-ota-receiver-test
          /tmp/lighthouse-ota-receiver-test
          python -m unittest discover -s test -p 'test_ota_package.py' -v
      - name: Package flash image and source
        run: python tools/package_release.py
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: ${{ runner.os }}-matter-arduino-3.3.12-nimble-2.5.2-json-6.21.5-wm-2.0.17
      - name: Check bounded Matter status serialization
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I .pio/libdeps/esp32dev/ArduinoJson/src test/test_status.cpp -o /tmp/lighthouse-status-test
          /tmp/lighthouse-status-test
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_matter_endpoint.cpp -o /tmp/lighthouse-matter-endpoint-test
          /tmp/lighthouse-matter-endpoint-test
      - name: Install isolated Matter prototype dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'NimBLE-Arduino@2.5.2' 'ArduinoJson@6.21.5' 'WiFiManager@2.0.17'
      - name: Build experimental Matter prototype with existing partition layout
        run: python tools/build_matter.py
      - name: Build WebFlasher site
        run: python tools/build_pages.py
      - name: Test WebFlasher assets
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Check USB protocol and update layout
        run: |
          node test/serial_info.cjs
          node test/matter_info.cjs
      - name: Test simulated browser and USB flows
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-bridge-firmware
          path: dist/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Retain matching symbols for crash diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-bridge-debug
          include-hidden-files: true
          path: |
            .pio/build/esp32dev/firmware.elf
            .pio/build/esp32dev/firmware.map
            .pio/matter-build/MatterBridge.ino.elf
            .pio/matter-build/MatterBridge.ino.map

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish WebFlasher
        id: deployment
        uses: actions/deploy-pages@v4
