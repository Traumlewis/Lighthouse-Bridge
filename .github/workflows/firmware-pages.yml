name: Firmware & WebFlasher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Check command handling
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/test_core.cpp -o /tmp/lighthouse-test
          /tmp/lighthouse-test
      - name: Build ESP32 firmware
        run: pio run
      - name: Package flash image and source
        run: python tools/package_release.py
      - name: Build WebFlasher site
        run: python tools/build_pages.py
      - name: Test WebFlasher assets
        run: python -m unittest discover -s test -p 'test_pages.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-bridge-firmware
          path: dist/
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish WebFlasher
        id: deployment
        uses: actions/deploy-pages@v4
