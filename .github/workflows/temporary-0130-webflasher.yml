name: Publish temporary 0.1.30 WebFlasher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download the currently published WebFlasher
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: current
          run-id: 45243859636
          github-token: ${{ github.token }}
      - name: Download the original 0.1.30 WebFlasher
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: historical
          run-id: 45163198385
          github-token: ${{ github.token }}
      - name: Assemble both verified releases
        run: |
          mkdir published
          tar -xf current/artifact.tar -C published
          test "$(jq -r .version published/manifest.json)" = "0.1.33"
          mkdir published/test-0.1.30
          tar -xf historical/artifact.tar -C published/test-0.1.30
          for manifest in published/test-0.1.30/*manifest.json; do
            test "$(jq -r .version "$manifest")" = "0.1.30"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
