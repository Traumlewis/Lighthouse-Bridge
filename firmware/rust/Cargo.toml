[package]
name = "lighthouse-rs-matter"
version = "0.1.39"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "43f61585a439f1a1e90924b696a6280850ef0145", default-features = false, features = ["rustcrypto", "groups", "log", "stack-max-im-buffers-4", "stack-max-responders-2", "stack-max-subscriptions-8"] }
log = { version = "0.4", default-features = false, features = ["max_level_info"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
critical-section = { version = "1.1", features = ["restore-state-u32"] }
rand = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "riscv32")'.dependencies]
portable-atomic = { version = "=1.15.0", default-features = false, features = ["critical-section"] }
# Keep the no-outliner C3 image inside both OTA slots. Keep error
# logs and direct typed tracing of Matter state, endpoints and transport.
log = { version = "0.4", default-features = false, features = ["release_max_level_error"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"
