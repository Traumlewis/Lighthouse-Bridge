[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@6.21.5
  https://github.com/Aircoookie/Espalexa.git#40bf53a0c2e73c25d66da9a66a70307f1d304314
build_flags =
  -D ESPALEXA_MAXDEVICES=5
  -D ESPALEXA_NO_SUBPAGE
  -D CORE_DEBUG_LEVEL=0

